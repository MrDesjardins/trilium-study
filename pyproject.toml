[project]
name = "trilium-study"
version = "0.1.0"
description = "Single-user study pipeline for Trilium lesson generation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.1",
  "fastapi>=0.116.0",
  "fsrs>=5.0,<6",
  "jinja2>=3.1.6",
  "google-api-python-client>=2.172.0",
  "google-auth-oauthlib>=1.2.2",
  "httpx>=0.28.1",
  "openai>=1.86.0",
  "pydantic-settings>=2.10.1",
  "python-dotenv>=1.1.1",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0.41",
  "uvicorn>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
]
youtube = [
  "google-api-python-client>=2.172.0",
  "google-auth-oauthlib>=1.2.2",
]
tts = [
  "kokoro>=0.9.4",
  "numpy>=2.3.0",
  "soundfile>=0.13.1",
]

[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
